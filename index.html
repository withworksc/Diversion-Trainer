<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C8 Diversion Trainer — RCFN / RCKW</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>C8 Diversion Trainer</h1>
  <span class="sub">RCFN ⇄ RCKW · 底圖：CAA VFR Chart ICAO Taipei FIR 1:500,000 (20 Sep 2025)</span>
  <span class="clock">計時 <b id="stopwatch">00:00</b></span>
</header>

<div class="controls">
  <button id="next">出題</button>
  <button id="reveal" class="ghost">顯示答案</button>
  <label class="inline">改降場
    <select id="destPick">
      <option value="auto">依實際機率隨機</option>
      <option value="RCKH">RCKH 高雄</option>
      <option value="RCLY">RCLY 蘭嶼</option>
      <option value="RCFN">RCFN 豐年</option>
      <option value="RCGI">RCGI 綠島</option>
      <option value="RCYU">RCYU 花蓮</option>
      <option value="RCKW">RCKW 恆春</option>
    </select>
  </label>
  <button id="attToggle" class="ghost ghost-toggle" aria-pressed="false">姿態訓練（prototype）</button>
  <!-- 兩段各自不斷行,只在分號後面換行(見 css/style.css 的 .att-hint) -->
  <span class="att-hint" id="attHint"><span>接搖桿請用 Chrome、Edge、Brave 等 Chromium 核心瀏覽器；</span><wbr><span>Safari 讀不到飛行搖桿。</span></span>
</div>

<!-- 上排:SITUATION、平面圖、姿態訓練(prototype)。.cols 這個 class 名稱不要改——
     js/ui.js 的姿態開關用 querySelector('.cols') 找它、加上 att-on -->
<div class="cols">
  <section class="brief" id="brief"></section>
  <section class="mapcell">
    <h2>CHART</h2>
    <div id="map"></div>
  </section>
  <section class="attitude" id="attitude" hidden>
    <div class="att-head">
      <h2>姿態訓練 <span class="beta">prototype</span></h2>
      <!-- 亂流大小(v2.1)。data-level 對應 js/attitude.js 的 CFG.turbulence -->
      <div class="turb" id="turbPick" role="group" aria-label="亂流大小">
        <span>亂流</span>
        <button type="button" data-level="easy" aria-pressed="false">易</button>
        <button type="button" data-level="medium" aria-pressed="true">中</button>
        <button type="button" data-level="hard" aria-pressed="false">難</button>
      </div>
    </div>
    <div id="aiHost"></div>
    <p class="ai-note" id="aiNote">出題後開始亂流。</p>
  </section>
</div>

<!-- 下排:改降程序八格,桌面版橫排 -->
<section class="sheet" id="sheet"></section>

<p class="tip">
  這個工具只給答案，不判對錯。距離與航向由圖上座標推算，誤差約 1–2 NM / 2–3°，正式作業請以航圖實量為準。
</p>

</div>

<script src="js/geo.js"></script>
<script src="js/data.js"></script>
<script src="js/scenario.js"></script>
<script src="js/map.js"></script>
<script src="js/compute.js"></script>
<script src="js/attitude.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
